name: AtmoSec
description: 'AtmoSec was an Israel-based SaaS security startup founded in January
  2021 that built a platform for securing hyperconnected SaaS ecosystems. Its technology
  discovered authorized and shadow SaaS applications, controlled risky SaaS-to-SaaS
  and third-party OAuth app communication, detected and disconnected malicious apps,
  remediated SaaS misconfigurations, and governed non-human identities (API keys,
  OAuth apps, service accounts, and tokens) via native IAM APIs. Founded by former
  Armis and Google executives and backed by Battery Ventures and Glilot Capital, AtmoSec
  was acquired by Check Point Software Technologies in September 2023 and folded into
  the Check Point Infinity / SASE platform for continuous SaaS posture management.
  It no longer operates as a standalone company and publishes no public developer
  API; atmosec.com now redirects into checkpoint.com.'
